name: Outreach CI

on:
  pull_request:
    paths:
      - "alea-gsw/apps/aleasat-site/**"
      - "alea-gsw/packages/ui/**"
      - "alea-gsw/packages/utils/**"
      - "alea-gsw/package.json"
      - "alea-gsw/yarn.lock"
      - "alea-gsw/.yarnrc.yml"
      - "alea-gsw/turbo.json"
      - ".github/workflows/outreach-ci.yml"
  push:
    branches:
      - main
    paths:
      - "alea-gsw/apps/aleasat-site/**"
      - "alea-gsw/packages/ui/**"
      - "alea-gsw/packages/utils/**"
      - "alea-gsw/package.json"
      - "alea-gsw/yarn.lock"
      - "alea-gsw/.yarnrc.yml"
      - "alea-gsw/turbo.json"
      - ".github/workflows/outreach-ci.yml"
  workflow_dispatch:

concurrency:
  group: outreach-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  AUTH_SECRET: testsecret
  NEXTAUTH_SECRET: testsecret
  AUTH_TRUST_HOST: "true"
  AUTH_URL: http://localhost:3000

defaults:
  run:
    working-directory: alea-gsw

jobs:
  quality:
    name: Types and changed-file lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Rebuild CI tools
        run: yarn rebuild tsc turbo @biomejs/biome

      - name: Build shared types
        run: yarn build:types --cache-dir=".turbo" --continue

      - name: Type check workspaces
        run: yarn test:types --cache-dir=".turbo" --continue

      - name: Lint changed outreach files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base commit. Skipping changed-file lint."
            exit 0
          fi

          mapfile -t changed < <(
            git diff --name-only "$base" "$GITHUB_SHA" --               "alea-gsw/apps/aleasat-site/**/*.ts"               "alea-gsw/apps/aleasat-site/**/*.tsx"               "alea-gsw/packages/ui/**/*.ts"               "alea-gsw/packages/ui/**/*.tsx"               "alea-gsw/packages/utils/**/*.ts"               "alea-gsw/packages/utils/**/*.tsx"
          )

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          site_files=()
          ui_files=()
          utils_files=()

          for file in "${changed[@]}"; do
            case "$file" in
              alea-gsw/apps/aleasat-site/*)
                site_files+=("${file#alea-gsw/apps/aleasat-site/}")
                ;;
              alea-gsw/packages/ui/*)
                ui_files+=("${file#alea-gsw/packages/ui/}")
                ;;
              alea-gsw/packages/utils/*)
                utils_files+=("${file#alea-gsw/packages/utils/}")
                ;;
            esac
          done

          if [[ ${#site_files[@]} -gt 0 ]]; then
            yarn workspace @aleasat/aleasat-site exec biome ci "${site_files[@]}"
          fi

          if [[ ${#ui_files[@]} -gt 0 ]]; then
            yarn workspace @aleasat/ui exec biome ci "${ui_files[@]}"
          fi

          if [[ ${#utils_files[@]} -gt 0 ]]; then
            yarn workspace @aleasat/utils exec biome ci "${utils_files[@]}"
          fi

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared types
        run: yarn build:types --cache-dir=".turbo"

      - name: Build outreach website
        run: yarn workspace @aleasat/aleasat-site build

  e2e:
    name: Cypress smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared types
        run: yarn build:types --cache-dir=".turbo"

      - name: Build outreach website
        run: yarn workspace @aleasat/aleasat-site build

      - name: Start outreach website
        run: |
          yarn workspace @aleasat/aleasat-site start > /tmp/aleasat-site.log 2>&1 &
          echo $! > /tmp/aleasat-site.pid

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000 > /dev/null; then
              echo "Website is ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/aleasat-site.pid)" 2>/dev/null; then
              echo "Website process exited before becoming ready"
              cat /tmp/aleasat-site.log
              exit 1
            fi

            sleep 2
          done

          echo "Website did not become ready in time"
          cat /tmp/aleasat-site.log
          exit 1

      - name: Run Cypress smoke suite
        run: |
          cd apps/aleasat-site
          yarn cypress run             --spec cypress/e2e/smoke.cy.ts             --browser chrome             --config watchForFileChanges=false

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/aleasat-site.log || true

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outreach-cypress
          if-no-files-found: ignore
          path: |
            alea-gsw/apps/aleasat-site/cypress/screenshots
            alea-gsw/apps/aleasat-site/cypress/videos

  container:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build outreach container
        run: |
          docker build             --file apps/aleasat-site/Dockerfile             --tag aleasat-site:ci             .
